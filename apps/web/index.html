<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" id="brand-favicon-dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" media="(prefers-color-scheme: light)" id="brand-favicon-light" />
    <title>DSH Local Build</title>
    <script>
      // Per-port brand colour for the fork 双实例 (3080, 3081): dist is shared
      // across instances and never gets port-aware at disk level, so the colour
      // is rewritten here at parse time. Asset variants live at /brand/{color}.svg.
      (function () {
        var COLOURS = { '3080': 'red', '3081': 'green' };
        var colour = COLOURS[location.port];
        if (colour === undefined) return;
        document.documentElement.style.setProperty('--dsh-brand-color', colour);
        var dark = document.getElementById('brand-favicon-dark');
        var light = document.getElementById('brand-favicon-light');
        if (dark !== null) dark.href = '/brand/' + colour + '-dark.svg';
        if (light !== null) light.href = '/brand/' + colour + '.svg';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
